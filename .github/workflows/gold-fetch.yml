name: Fetch Gold OCR From Facebook Public Page

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-gold-ocr
  cancel-in-progress: true

jobs:
  fetch-gold:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      APP_MODE: cli
      APP_TIMEZONE: Asia/Dubai
      LOG_LEVEL: INFO
      REQUEST_TIMEOUT: "35"

      GOLD_OCR_MODE: prefer_blueprint
      GOLD_DEBUG_EXPORT: "false"

      GOLD_CACHE_ENABLED: "true"
      GOLD_IMAGE_CACHE_ENABLED: "true"
      GOLD_OCR_CACHE_MAX_ENTRIES: "300"
      GOLD_IMAGE_CACHE_MAX_ENTRIES: "80"
      GOLD_IMAGE_CACHE_TTL_HOURS: "72"

      GOLD_MIN_SOURCE_WIDTH: "750"
      GOLD_MIN_SOURCE_HEIGHT: "750"

      FACEBOOK_HEADLESS: "true"
      FACEBOOK_PAGE_URL: "https://m.facebook.com/profile.php?id=61575835207125"
      FACEBOOK_URL_MODE: "mobile"
      FACEBOOK_OUTPUT_JSON: "data/facebook_latest_image.json"
      FACEBOOK_SCREENSHOT_FILE: "data/facebook_page_debug.png"
      FACEBOOK_REQUEST_TIMEOUT_MS: "30000"

      FACEBOOK_MAX_SCROLL_STEPS: "2"
      FACEBOOK_SCROLL_DELAY_MS: "1000"
      FACEBOOK_MAX_CANDIDATES_TO_TRY: "4"
      FACEBOOK_MAX_POSTS_TO_SCAN: "3"

      FACEBOOK_FAST_RESOURCE_BLOCKING: "true"
      FACEBOOK_SAVE_DEBUG_SCREENSHOT: "false"

      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install chromium

      - name: Ensure directories
        run: |
          mkdir -p data/tmp_fb_images

      - name: Fetch Facebook candidates
        run: python scripts/fetch_facebook_public_image.py

      - name: Run OCR pipeline
        run: python scripts/run_gold_from_facebook_json.py

      # ✅ KEEP ONLY SUCCESS IMAGE
      - name: Keep only successful candidate image
        run: |
          echo "Cleaning tmp images..."
          SUCCESS_IMG=$(jq -r '.source' data/latest.json || echo "")

          if [[ "$SUCCESS_IMG" == file://* ]]; then
            SUCCESS_PATH=${SUCCESS_IMG#file://}
            echo "Success image: $SUCCESS_PATH"

            for f in data/tmp_fb_images/*; do
              if [ "$f" != "$SUCCESS_PATH" ]; then
                rm -f "$f"
              fi
            done
          else
            echo "No valid success image found"
          fi

      - name: Show outputs
        if: always()
        run: |
          echo "latest.json:"
          cat data/latest.json || true
          echo
          echo "saved images:"
          ls -la data/tmp_fb_images || true

      # ✅ Upload only final image (optional)
      - name: Upload final image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: final-gold-image
          path: data/tmp_fb_images/*
          if-no-files-found: ignore

      - name: Commit results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/latest.json data/history.json data/tmp_fb_images || true

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update gold OCR + latest image"

          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "Retry push $i"
            sleep 2
          done
