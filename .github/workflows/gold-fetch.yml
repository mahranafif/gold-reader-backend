name: Fetch Gold OCR From Facebook Public Page

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-gold:
    runs-on: ubuntu-latest

    env:
      APP_MODE: cli
      APP_TIMEZONE: Asia/Dubai
      LOG_LEVEL: INFO
      GOLD_OCR_MODE: prefer_blueprint
      REQUEST_TIMEOUT: 35

      FACEBOOK_HEADLESS: "true"
      FACEBOOK_PAGE_URL: "https://m.facebook.com/profile.php?id=61575835207125"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy \
            pytesseract \
            requests \
            uvicorn \
            beautifulsoup4 \
            fastapi \
            paddleocr \
            pillow \
            pydantic \
            playwright

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Ensure data dir exists
        run: mkdir -p data

      - name: Scrape public Facebook image
        run: python scripts/fetch_facebook_public_image.py

      - name: Run gold OCR using scraped image
        run: python scripts/run_gold_from_facebook_json.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/latest.json data/history.json data/facebook_latest_image.json data/debug || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update gold OCR snapshot"
            git push
          fi
