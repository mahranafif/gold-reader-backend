name: Gold Fetch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: gold-fetch-main
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show config
        env:
          GOLD_SOURCE_URL: ${{ vars.GOLD_SOURCE_URL }}
          GOLD_OCR_MODE: ${{ vars.GOLD_OCR_MODE }}
        run: |
          python - <<'PY'
          import os
          source = os.getenv("GOLD_SOURCE_URL", "")
          mode = os.getenv("GOLD_OCR_MODE", "")
          print("GOLD_SOURCE_URL is set:", bool(source))
          print("Starts with http:", source.startswith("http"))
          print("GOLD_OCR_MODE:", mode or "(empty -> script default)")
          PY

      - name: Ensure data files exist
        run: |
          mkdir -p data
          test -f data/latest.json || echo '{"ok": false, "source": "", "date": "0000/00/00", "time": "00:00", "k21_ss": 0, "k21_sb": 0, "k21_us": 0, "k21_ub": 0, "k18_ss": 0, "k18_sb": 0, "k18_us": 0, "k18_ub": 0, "updated_at_utc": ""}' > data/latest.json
          test -f data/history.json || echo '[]' > data/history.json

      - name: Run fetch script
        env:
          GOLD_SOURCE_URL: ${{ vars.GOLD_SOURCE_URL }}
          GOLD_OCR_MODE: ${{ vars.GOLD_OCR_MODE }}
        run: |
          python scripts/fetch_gold.py

      - name: Show latest result
        run: |
          echo "----- data/latest.json -----"
          cat data/latest.json

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/latest.json data/history.json data/blueprint.json
          git diff --cached --quiet && exit 0

          git commit -m "Update gold prices"

          git fetch origin main
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Wait before next run
        if: success()
        run: sleep 120

      - name: Trigger next run
        if: success()
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/gold-fetch.yml/dispatches \
            -d '{"ref":"main"}'
