name: Fetch Gold OCR From Facebook Public Page

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-gold-ocr
  cancel-in-progress: true

jobs:
  fetch-gold:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      APP_MODE: cli
      APP_TIMEZONE: Asia/Dubai
      LOG_LEVEL: INFO
      REQUEST_TIMEOUT: "35"

      GOLD_OCR_MODE: prefer_blueprint
      GOLD_DEBUG_EXPORT: "true"

      GOLD_CACHE_ENABLED: "false"
      GOLD_IMAGE_CACHE_ENABLED: "false"
      GOLD_OCR_CACHE_MAX_ENTRIES: "0"
      GOLD_IMAGE_CACHE_MAX_ENTRIES: "0"
      GOLD_IMAGE_CACHE_TTL_HOURS: "0"

      GOLD_MIN_SOURCE_WIDTH: "750"
      GOLD_MIN_SOURCE_HEIGHT: "750"

      FACEBOOK_HEADLESS: "true"
      FACEBOOK_PAGE_URL: "https://m.facebook.com/profile.php?id=61575835207125"
      FACEBOOK_URL_MODE: "mobile"
      FACEBOOK_OUTPUT_JSON: "data/facebook_latest_image.json"
      FACEBOOK_SCREENSHOT_FILE: "data/facebook_page_debug.png"
      FACEBOOK_REQUEST_TIMEOUT_MS: "30000"
      FACEBOOK_MAX_SCROLL_STEPS: "4"
      FACEBOOK_SCROLL_DELAY_MS: "1600"
      FACEBOOK_MAX_CANDIDATES_TO_TRY: "6"
      FACEBOOK_MAX_CANDIDATES_PER_POST: "4"
      FACEBOOK_MAX_POST_GROUPS: "2"
      FACEBOOK_MAX_POSTS_TO_SCAN: "2"
      FACEBOOK_MIN_CANDIDATE_WIDTH: "250"
      FACEBOOK_MIN_CANDIDATE_HEIGHT: "250"
      FACEBOOK_PREFERRED_CANDIDATE_WIDTH: "400"
      FACEBOOK_PREFERRED_CANDIDATE_HEIGHT: "400"
      FACEBOOK_HIGH_RES_WIDTH: "900"
      FACEBOOK_HIGH_RES_HEIGHT: "900"
      FACEBOOK_FAST_RESOURCE_BLOCKING: "true"
      FACEBOOK_SAVE_DEBUG_SCREENSHOT: "true"

      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      DISABLE_PADDLE: "false"

      CNN_POSTER_MIN_CONFIDENCE: "0.75"
      CNN_POSTER_MIN_MARGIN: "0.20"
      CNN_LAYOUT_MIN_CONFIDENCE: "0.50"

      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_PYTHON_VERSION_WARNING: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-*.txt

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f requirements-ocr.txt ]; then
            pip install -r requirements-ocr.txt
          fi

      - name: Install Playwright browsers
        run: python -m playwright install chromium

      - name: Ensure data directories exist
        run: |
          mkdir -p data
          mkdir -p data/debug
          mkdir -p data/debug/fields
          mkdir -p data/cache
          mkdir -p data/cache/images
          mkdir -p data/tmp_fb_images

      - name: Fetch latest Facebook image candidates
        run: python scripts/fetch_facebook_public_image.py

      - name: Run Facebook image -> OCR pipeline
        run: python scripts/run_gold_from_facebook_json.py

      - name: Show outputs
        if: always()
        run: |
          echo "facebook_latest_image.json:"
          cat data/facebook_latest_image.json || true
          echo
          echo "latest.json:"
          cat data/latest.json || true
          echo
          echo "facebook_ocr_failures.json:"
          cat data/facebook_ocr_failures.json || true

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-ocr-debug
          path: |
            data/facebook_latest_image.json
            data/latest.json
            data/history.json
            data/facebook_ocr_failures.json
            data/facebook_page_debug.png
            data/debug
          if-no-files-found: ignore

      - name: Commit updated JSON files
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json data/facebook_latest_image.json data/facebook_ocr_failures.json || true
          git diff --cached --quiet || git commit -m "Update gold OCR data"
          git push
