name: Gold Fetch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: gold-fetch-main
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libgl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify PaddleOCR
        env:
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
        run: |
          python - <<'PY'
          import paddle
          from paddleocr import PaddleOCR
          print("Paddle version:", paddle.__version__)
          ocr = PaddleOCR(
              use_doc_orientation_classify=False,
              use_doc_unwarping=False,
              use_textline_orientation=False,
          )
          print("PaddleOCR init: OK")
          PY

      - name: Show config
        env:
          GOLD_SOURCE_URL: ${{ vars.GOLD_SOURCE_URL }}
          GOLD_OCR_MODE: ${{ vars.GOLD_OCR_MODE }}
        run: |
          python - <<'PY'
          import os
          print("GOLD_SOURCE_URL is set:", bool(os.getenv("GOLD_SOURCE_URL", "")))
          print("GOLD_OCR_MODE:", os.getenv("GOLD_OCR_MODE", "prefer_blueprint"))
          PY

      - name: Ensure data files exist
        run: |
          mkdir -p data
          test -f data/latest.json || echo '{"ok": false, "source": "", "date": "0000/00/00", "time": "00:00", "k21_ss": 0, "k21_sb": 0, "k21_us": 0, "k21_ub": 0, "k18_ss": 0, "k18_sb": 0, "k18_us": 0, "k18_ub": 0, "updated_at_utc": ""}' > data/latest.json
          test -f data/history.json || echo '[]' > data/history.json

      - name: Run fetch script
        env:
          GOLD_SOURCE_URL: ${{ vars.GOLD_SOURCE_URL }}
          GOLD_OCR_MODE: ${{ vars.GOLD_OCR_MODE }}
        run: |
          python scripts/fetch_gold.py

      - name: Show latest result
        run: |
          echo "----- data/latest.json -----"
          cat data/latest.json

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/latest.json data/history.json data/blueprint.json
          git diff --cached --quiet && exit 0

          git commit -m "Update gold prices"
          git fetch origin main
          git pull --rebase origin main
          git push origin HEAD:main
