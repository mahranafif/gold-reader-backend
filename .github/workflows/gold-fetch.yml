name: Gold Fetch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show source URL exists
        env:
          GOLD_SOURCE_URL: ${{ vars.GOLD_SOURCE_URL }}
        run: |
          python - <<'PY'
          import os
          url = os.getenv("GOLD_SOURCE_URL", "")
          print("GOLD_SOURCE_URL is set:", bool(url))
          print("Starts with http:", url.startswith("http"))
          PY

      - name: Run fetch script
        env:
          GOLD_SOURCE_URL: ${{ vars.GOLD_SOURCE_URL }}
        run: |
          python scripts/fetch_gold.py

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/latest.json data/history.json
          git diff --cached --quiet && exit 0

          git commit -m "Update gold prices"

          git pull --rebase origin main
          git push origin main
