name: Fetch Gold OCR From Facebook Public Page

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-gold-ocr
  cancel-in-progress: true

jobs:
  fetch-gold:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      APP_MODE: cli
      APP_TIMEZONE: Asia/Dubai
      LOG_LEVEL: INFO
      REQUEST_TIMEOUT: "35"
      GOLD_OCR_MODE: prefer_blueprint
      GOLD_DEBUG_EXPORT: "false"

      FACEBOOK_PAGE_URL: "https://www.facebook.com/profile.php?id=61575835207125"
      FACEBOOK_URL_MODE: "desktop"
      FACEBOOK_HEADLESS: "true"
      FACEBOOK_OUTPUT_JSON: "data/facebook_latest_image.json"
      FACEBOOK_SCREENSHOT_FILE: "data/facebook_page_debug.png"
      FACEBOOK_REQUEST_TIMEOUT_MS: "22000"
      FACEBOOK_MAX_SCROLL_STEPS: "4"
      FACEBOOK_SCROLL_DELAY_MS: "900"
      FACEBOOK_MAX_POSTS_TO_SCAN: "6"
      FACEBOOK_MAX_POST_GROUPS: "3"
      FACEBOOK_MAX_CANDIDATES_PER_POST: "8"
      FACEBOOK_MAX_CANDIDATES_TO_TRY: "10"
      FACEBOOK_MIN_CANDIDATE_WIDTH: "700"
      FACEBOOK_MIN_CANDIDATE_HEIGHT: "700"
      FACEBOOK_FAST_RESOURCE_BLOCKING: "true"
      FACEBOOK_SAVE_DEBUG_SCREENSHOT: "true"

      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      DISABLE_PADDLE: "true"

      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_PYTHON_VERSION_WARNING: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium

      - name: Run Facebook image scraper
        run: |
          python scripts/fetch_facebook_public_image.py

      - name: Run gold fetch pipeline
        run: |
          python scripts/fetch_gold.py

      - name: Commit and push changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/latest.json data/history.json data/facebook_latest_image.json || true

          if ! git diff --cached --quiet; then
            git commit -m "Update gold OCR data"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gold-debug-artifacts
          path: |
            data/facebook_page_debug.png
            data/login_wall.png
            data/facebook_latest_image.json
            data/latest.json
            data/history.json
          if-no-files-found: ignore
