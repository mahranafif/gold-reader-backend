name: Fetch Gold OCR From Facebook Public Page

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-gold-ocr
  cancel-in-progress: true

jobs:
  fetch-gold:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      # =============================
      # Core App Config
      # =============================
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      APP_MODE: cli
      APP_TIMEZONE: Asia/Dubai
      LOG_LEVEL: INFO
      REQUEST_TIMEOUT: "35"

      # =============================
      # OCR Config
      # =============================
      GOLD_OCR_MODE: prefer_blueprint
      GOLD_DEBUG_EXPORT: "true"

      # STRICT QUALITY (important)
      GOLD_MIN_SOURCE_WIDTH: "750"
      GOLD_MIN_SOURCE_HEIGHT: "750"

      # =============================
      # CACHE (disabled for accuracy)
      # =============================
      GOLD_CACHE_ENABLED: "false"
      GOLD_IMAGE_CACHE_ENABLED: "false"
      GOLD_OCR_CACHE_MAX_ENTRIES: "0"
      GOLD_IMAGE_CACHE_MAX_ENTRIES: "0"
      GOLD_IMAGE_CACHE_TTL_HOURS: "0"

      # =============================
      # Facebook Scraper (FINAL)
      # =============================
      FACEBOOK_HEADLESS: "true"
      FACEBOOK_PAGE_URL: "https://m.facebook.com/profile.php?id=61575835207125"
      FACEBOOK_URL_MODE: "mobile"

      FACEBOOK_OUTPUT_JSON: "data/facebook_latest_image.json"
      FACEBOOK_SCREENSHOT_FILE: "data/facebook_page_debug.png"

      FACEBOOK_REQUEST_TIMEOUT_MS: "30000"

      # 🔥 NEW SIMPLE SCRAPER CONFIG
      FACEBOOK_MAX_IMAGE_POLLS: "8"
      FACEBOOK_SCRAPE_POLL_DELAY_MS: "1200"
      FACEBOOK_INITIAL_SCRAPE_DELAY_MS: "1500"
      FACEBOOK_MAX_CANDIDATES_TO_TRY: "12"

      # Discovery thresholds (low)
      FACEBOOK_MIN_CANDIDATE_WIDTH: "250"
      FACEBOOK_MIN_CANDIDATE_HEIGHT: "250"

      # Preferred (used in scoring)
      FACEBOOK_PREFERRED_CANDIDATE_WIDTH: "780"
      FACEBOOK_PREFERRED_CANDIDATE_HEIGHT: "780"

      FACEBOOK_FAST_RESOURCE_BLOCKING: "true"
      FACEBOOK_SAVE_DEBUG_SCREENSHOT: "true"

      # =============================
      # ML Config
      # =============================
      CNN_POSTER_MIN_CONFIDENCE: "0.75"
      CNN_POSTER_MIN_MARGIN: "0.20"
      CNN_LAYOUT_MIN_CONFIDENCE: "0.50"

      # =============================
      # Python Runtime
      # =============================
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_PYTHON_VERSION_WARNING: "1"

      # Paddle fix
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"

    steps:
      # =============================
      # Checkout
      # =============================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =============================
      # Setup Python
      # =============================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =============================
      # Install Dependencies
      # =============================
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          playwright install chromium

      # =============================
      # Run Scraper (HI-RES)
      # =============================
      - name: Fetch Facebook Image (Hi-Res Scraper)
        run: python scripts/fetch_facebook_public_image.py

      # =============================
      # Run OCR Pipeline (OCR-FIRST)
      # =============================
      - name: Run OCR From Facebook JSON
        run: python scripts/run_gold_from_facebook_json.py

      # =============================
      # Debug Output
      # =============================
      - name: Show latest.json
        run: |
          echo "latest.json:"
          cat data/latest.json || true

      - name: Show failures
        run: |
          echo "facebook_ocr_failures.json:"
          cat data/facebook_ocr_failures.json || true

      # =============================
      # Commit Results
      # =============================
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add data/latest.json data/history.json data/facebook_ocr_failures.json || true

          git diff --cached --quiet || git commit -m "Update gold OCR data [skip ci]"
          git push
